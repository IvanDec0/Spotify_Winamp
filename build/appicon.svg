<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title">
  <title id="title">Cadence</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0e13"/>
      <stop offset="1" stop-color="#151a23"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5ef0ff"/>
      <stop offset="1" stop-color="#7d8cff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="32" y="32" width="960" height="960" rx="220" fill="url(#bg)"/>
  <rect x="32.5" y="32.5" width="959" height="959" rx="219.5" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
  <path d="M700 330A250 250 0 1 0 700 694" fill="none" stroke="url(#arc)" stroke-width="46" stroke-linecap="round" filter="url(#glow)"/>
  <g fill="#5ef0ff">
    <rect x="390" y="452" width="24" height="120" rx="12" opacity=".9"/>
    <rect x="438" y="412" width="24" height="200" rx="12" opacity=".7"/>
    <rect x="486" y="472" width="24" height="80" rx="12" opacity=".55"/>
    <rect x="534" y="432" width="24" height="160" rx="12" opacity=".35"/>
  </g>
  <circle cx="700" cy="330" r="20" fill="#d9fbff"/>
</svg>

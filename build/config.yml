# Wails build metadata. The product identifier is provisional until the final
# application name and bundle ID are locked.
version: '3'

info:
  companyName: "Cadence"
  productName: "Cadence"
  productIdentifier: "io.github.ivandec0.cadence"
  description: "A compact local Spotify player with declarative skins"
  copyright: "© 2026 Cadence contributors"
  comments: "Built with Go, Wails and Svelte."
  version: "0.2.0"

# Dev mode configuration
dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
      - "*.js" # Watch for changes to JS/TS files included using the //wails:include directive.
      - "*.ts" # The frontend directory is excluded entirely by the setting above.
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary
      exit_policy: shutdown

version: '3'

includes:
  common: ../Taskfile.yml

tasks:
  build:
    summary: Builds the application natively on Linux
    deps:
      - task: common:go:mod:tidy
      - task: common:build:frontend
        vars:
          DEV: '{{.DEV}}'
          BUILD_FLAGS: '{{.BUILD_FLAGS}}'
    cmds:
      - go build {{.BUILD_FLAGS}} -o "{{.OUTPUT}}"
    vars:
      BUILD_FLAGS: '{{if eq .DEV "true"}}-buildvcs=false -gcflags=all="-l"{{else}}-tags production -trimpath -buildvcs=false -ldflags="-w -s -X cadence/internal/buildinfo.Version={{.APP_VERSION}} -X cadence/internal/buildinfo.Commit={{.GIT_COMMIT}}"{{end}}'
      DEFAULT_OUTPUT: '{{.BIN_DIR}}/{{.APP_NAME}}'
      OUTPUT: '{{.OUTPUT | default .DEFAULT_OUTPUT}}'
    env:
      GOOS: linux
      CGO_ENABLED: 1

  run:
    summary: Runs the built application
    cmds:
      - './{{.BIN_DIR}}/{{.APP_NAME}}'

  package:
    summary: Creates AppImage and tar.gz artifacts with checksums
    deps:
      - task: build
    cmds:
      - task: create:appimage
      - task: create:tarball
      - task: checksums

  create:appimage:
    summary: Creates an AppImage with the go-librespot engine bundled
    deps:
      - task: build
      - task: generate:dotdesktop
    dir: build/linux/appimage
    cmds:
      - cp "{{.ROOT_DIR}}/{{.BIN_DIR}}/{{.APP_NAME}}" "{{.APP_NAME}}"
      - cp "{{.ROOT_DIR}}/build/appicon.png" "{{.APP_NAME}}.png"
      - mkdir -p out
      # Start from a clean AppDir so stale WebKit generations and libraries from
      # a previous package run cannot leak into the new artifact.
      - rm -rf "{{.ROOT_DIR}}/build/linux/appimage/build/{{.APP_NAME}}-{{.ARCH}}.AppDir"
      - wails3 generate appimage -binary "{{.APP_NAME}}" -icon "{{.APP_NAME}}.png" -desktopfile "{{.ROOT_DIR}}/build/linux/{{.APP_NAME}}.desktop" -outputdir "{{.ROOT_DIR}}/build/linux/appimage/out" -builddir "{{.ROOT_DIR}}/build/linux/appimage/build"
      - rm -f "{{.ROOT_DIR}}/build/linux/appimage/out/{{.APP_NAME}}-{{.ARCH}}.AppImage"
      # Wails beta.34 copies every WebKit helper generation it finds, so the
      # AppDir ends up with both WebKitGTK 6.0 and WebKit2GTK 4.1. Cadence only
      # links the GTK4 stack; remove the unused GTK3/WebKit4.1 files before the
      # final linuxdeploy pack so its dependencies are not bundled either.
      - rm -rf "{{.ROOT_DIR}}/build/linux/appimage/build/{{.APP_NAME}}-{{.ARCH}}.AppDir/usr/lib/webkit2gtk-4.1" "{{.ROOT_DIR}}/build/linux/appimage/build/{{.APP_NAME}}-{{.ARCH}}.AppDir/usr/lib/girepository-1.0" "{{.ROOT_DIR}}/build/linux/appimage/build/{{.APP_NAME}}-{{.ARCH}}.AppDir/usr/lib/gtk-3.0" "{{.ROOT_DIR}}/build/linux/appimage/build/{{.APP_NAME}}-{{.ARCH}}.AppDir/usr/share/gtk-3.0"
      - rm -f "{{.ROOT_DIR}}/build/linux/appimage/build/{{.APP_NAME}}-{{.ARCH}}.AppDir/usr/lib/libwebkit2gtk-4.1.so"* "{{.ROOT_DIR}}/build/linux/appimage/build/{{.APP_NAME}}-{{.ARCH}}.AppDir/usr/lib/libjavascriptcoregtk-4.1.so"* "{{.ROOT_DIR}}/build/linux/appimage/build/{{.APP_NAME}}-{{.ARCH}}.AppDir/usr/lib/libgtk-3.so"* "{{.ROOT_DIR}}/build/linux/appimage/build/{{.APP_NAME}}-{{.ARCH}}.AppDir/usr/lib/libgdk-3.so"*
      - cp "{{.ROOT_DIR}}/{{.BIN_DIR}}/go-librespot" "{{.ROOT_DIR}}/build/linux/appimage/build/{{.APP_NAME}}-{{.ARCH}}.AppDir/usr/bin/go-librespot"
      - chmod 755 "{{.ROOT_DIR}}/build/linux/appimage/build/{{.APP_NAME}}-{{.ARCH}}.AppDir/usr/bin/go-librespot"
      - mkdir -p "{{.ROOT_DIR}}/build/linux/appimage/build/{{.APP_NAME}}-{{.ARCH}}.AppDir/usr/share/doc/cadence"
      - cp "{{.ROOT_DIR}}/README.md" "{{.ROOT_DIR}}/CHANGELOG.md" "{{.ROOT_DIR}}/THIRD-PARTY-NOTICES.md" "{{.ROOT_DIR}}/build/linux/appimage/build/{{.APP_NAME}}-{{.ARCH}}.AppDir/usr/share/doc/cadence/"
      - cp -R "{{.ROOT_DIR}}/docs" "{{.ROOT_DIR}}/LICENSES" "{{.ROOT_DIR}}/build/linux/appimage/build/{{.APP_NAME}}-{{.ARCH}}.AppDir/usr/share/doc/cadence/"
      - rm -rf "{{.ROOT_DIR}}/build/linux/appimage/build/{{.APP_NAME}}-{{.ARCH}}.AppDir/usr/share/doc/cadence/docs/screenshots"
      - mkdir -p "{{.ROOT_DIR}}/build/linux/appimage/build/{{.APP_NAME}}-{{.ARCH}}.AppDir/usr/share/cadence/skins"
      - cp -R "{{.ROOT_DIR}}/skins-dev/lumina" "{{.ROOT_DIR}}/skins-dev/afterglow" "{{.ROOT_DIR}}/skins-dev/vanta" "{{.ROOT_DIR}}/skins-dev/nightstar" "{{.ROOT_DIR}}/build/linux/appimage/build/{{.APP_NAME}}-{{.ARCH}}.AppDir/usr/share/cadence/skins/"
      - mkdir -p "{{.ROOT_DIR}}/build/linux/appimage/build/{{.APP_NAME}}-{{.ARCH}}.AppDir/usr/share/applications" "{{.ROOT_DIR}}/build/linux/appimage/build/{{.APP_NAME}}-{{.ARCH}}.AppDir/usr/share/pixmaps"
      - cp "{{.ROOT_DIR}}/build/linux/{{.APP_NAME}}.desktop" "{{.ROOT_DIR}}/build/linux/appimage/build/{{.APP_NAME}}-{{.ARCH}}.AppDir/usr/share/applications/{{.APP_NAME}}.desktop"
      - cp "{{.ROOT_DIR}}/build/appicon.png" "{{.ROOT_DIR}}/build/linux/appimage/build/{{.APP_NAME}}-{{.ARCH}}.AppDir/usr/share/pixmaps/{{.APP_NAME}}.png"
      - mkdir -p "{{.ROOT_DIR}}/build/linux/appimage/build/{{.APP_NAME}}-{{.ARCH}}.AppDir/usr/share/icons/hicolor/16x16/apps" "{{.ROOT_DIR}}/build/linux/appimage/build/{{.APP_NAME}}-{{.ARCH}}.AppDir/usr/share/icons/hicolor/32x32/apps" "{{.ROOT_DIR}}/build/linux/appimage/build/{{.APP_NAME}}-{{.ARCH}}.AppDir/usr/share/icons/hicolor/64x64/apps" "{{.ROOT_DIR}}/build/linux/appimage/build/{{.APP_NAME}}-{{.ARCH}}.AppDir/usr/share/icons/hicolor/128x128/apps" "{{.ROOT_DIR}}/build/linux/appimage/build/{{.APP_NAME}}-{{.ARCH}}.AppDir/usr/share/icons/hicolor/256x256/apps" "{{.ROOT_DIR}}/build/linux/appimage/build/{{.APP_NAME}}-{{.ARCH}}.AppDir/usr/share/icons/hicolor/512x512/apps"
      - cp "{{.ROOT_DIR}}/build/linux/icons/16x16.png" "{{.ROOT_DIR}}/build/linux/appimage/build/{{.APP_NAME}}-{{.ARCH}}.AppDir/usr/share/icons/hicolor/16x16/apps/{{.APP_NAME}}.png"
      - cp "{{.ROOT_DIR}}/build/linux/icons/32x32.png" "{{.ROOT_DIR}}/build/linux/appimage/build/{{.APP_NAME}}-{{.ARCH}}.AppDir/usr/share/icons/hicolor/32x32/apps/{{.APP_NAME}}.png"
      - cp "{{.ROOT_DIR}}/build/linux/icons/64x64.png" "{{.ROOT_DIR}}/build/linux/appimage/build/{{.APP_NAME}}-{{.ARCH}}.AppDir/usr/share/icons/hicolor/64x64/apps/{{.APP_NAME}}.png"
      - cp "{{.ROOT_DIR}}/build/linux/icons/128x128.png" "{{.ROOT_DIR}}/build/linux/appimage/build/{{.APP_NAME}}-{{.ARCH}}.AppDir/usr/share/icons/hicolor/128x128/apps/{{.APP_NAME}}.png"
      - cp "{{.ROOT_DIR}}/build/linux/icons/256x256.png" "{{.ROOT_DIR}}/build/linux/appimage/build/{{.APP_NAME}}-{{.ARCH}}.AppDir/usr/share/icons/hicolor/256x256/apps/{{.APP_NAME}}.png"
      - cp "{{.ROOT_DIR}}/build/linux/icons/512x512.png" "{{.ROOT_DIR}}/build/linux/appimage/build/{{.APP_NAME}}-{{.ARCH}}.AppDir/usr/share/icons/hicolor/512x512/apps/{{.APP_NAME}}.png"
      - chmod -R a+rX "{{.ROOT_DIR}}/build/linux/appimage/build/{{.APP_NAME}}-{{.ARCH}}.AppDir/usr/share/doc/cadence" "{{.ROOT_DIR}}/build/linux/appimage/build/{{.APP_NAME}}-{{.ARCH}}.AppDir/usr/share/applications" "{{.ROOT_DIR}}/build/linux/appimage/build/{{.APP_NAME}}-{{.ARCH}}.AppDir/usr/share/icons" "{{.ROOT_DIR}}/build/linux/appimage/build/{{.APP_NAME}}-{{.ARCH}}.AppDir/usr/share/pixmaps"
      - cd "{{.ROOT_DIR}}/build/linux/appimage/build" && NO_STRIP=1 OUTPUT="{{.ROOT_DIR}}/{{.BIN_DIR}}/{{.APP_NAME}}-{{.APP_VERSION}}-linux-{{.ARCH}}.AppImage" ./linuxdeploy-{{.ARCH}}.AppImage --appimage-extract-and-run --appdir {{.APP_NAME}}-{{.ARCH}}.AppDir --output appimage
      - rm -rf "{{.ROOT_DIR}}/build/linux/appimage/out"

  create:tarball:
    summary: Creates a portable tar.gz archive with the audio engine
    deps:
      - task: build
      - task: generate:dotdesktop
    dir: '{{.ROOT_DIR}}/{{.BIN_DIR}}'
    cmds:
      - mkdir -p "{{.APP_NAME}}-{{.APP_VERSION}}"
      - cp "{{.APP_NAME}}" "{{.APP_NAME}}-{{.APP_VERSION}}/"
      - cp "go-librespot" "{{.APP_NAME}}-{{.APP_VERSION}}/"
      - cp "{{.ROOT_DIR}}/build/appicon.png" "{{.APP_NAME}}-{{.APP_VERSION}}/{{.APP_NAME}}.png"
      - cp "{{.ROOT_DIR}}/build/linux/{{.APP_NAME}}.desktop" "{{.APP_NAME}}-{{.APP_VERSION}}/"
      - cp "{{.ROOT_DIR}}/LICENSE" "{{.ROOT_DIR}}/LICENSE-ASSETS" "{{.ROOT_DIR}}/README.md" "{{.ROOT_DIR}}/CHANGELOG.md" "{{.ROOT_DIR}}/THIRD-PARTY-NOTICES.md" "{{.APP_NAME}}-{{.APP_VERSION}}/"
      - cp -R "{{.ROOT_DIR}}/docs" "{{.ROOT_DIR}}/LICENSES" "{{.APP_NAME}}-{{.APP_VERSION}}/"
      - mkdir -p "{{.APP_NAME}}-{{.APP_VERSION}}/skins"
      - cp -R "{{.ROOT_DIR}}/skins-dev/lumina" "{{.ROOT_DIR}}/skins-dev/afterglow" "{{.ROOT_DIR}}/skins-dev/vanta" "{{.ROOT_DIR}}/skins-dev/nightstar" "{{.APP_NAME}}-{{.APP_VERSION}}/skins/"
      - tar -czf "{{.APP_NAME}}-{{.APP_VERSION}}-linux-{{.ARCH}}.tar.gz" "{{.APP_NAME}}-{{.APP_VERSION}}"
      - rm -rf "{{.APP_NAME}}-{{.APP_VERSION}}"

  checksums:
    summary: Writes SHA-256 checksums for release artifacts
    dir: '{{.ROOT_DIR}}/{{.BIN_DIR}}'
    cmds:
      - rm -f "{{.APP_NAME}}-{{.APP_VERSION}}-SHA256SUMS"
      - sha256sum "{{.APP_NAME}}-{{.APP_VERSION}}-linux-{{.ARCH}}.AppImage" "{{.APP_NAME}}-{{.APP_VERSION}}-linux-{{.ARCH}}.tar.gz" > "{{.APP_NAME}}-{{.APP_VERSION}}-SHA256SUMS"

  generate:dotdesktop:
    summary: Generates the Linux .desktop entry
    dir: build
    cmds:
      - mkdir -p linux
      - wails3 generate .desktop -name "Cadence" -genericname "Music Player" -comment "A compact local Spotify player with declarative skins" -exec "{{.APP_NAME}}" -icon "{{.APP_NAME}}" -keywords "spotify;music;player;audio;" -outputfile "{{.ROOT_DIR}}/build/linux/{{.APP_NAME}}.desktop" -categories "AudioVideo;Audio;"
      - sed -i '/^StartupWMClass=/d' "{{.ROOT_DIR}}/build/linux/{{.APP_NAME}}.desktop"
      - printf 'StartupWMClass=cadence\n' >> "{{.ROOT_DIR}}/build/linux/{{.APP_NAME}}.desktop"

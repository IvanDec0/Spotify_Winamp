version: '3'

tasks:
  go:mod:tidy:
    summary: Runs `go mod tidy`
    internal: true
    run: once
    cmds:
      - go mod tidy

  install:frontend:deps:
    summary: Installs pinned frontend dependencies
    run: once
    dir: frontend
    status:
      - test -f node_modules/.cadence-installed
      - test node_modules/.cadence-installed -nt package.json
      - test node_modules/.cadence-installed -nt package-lock.json
    preconditions:
      - sh: npm version
        msg: "npm is required. Install Node.js and npm first."
    cmds:
      - npm ci
      - touch node_modules/.cadence-installed

  generate:bindings:
    summary: Generates TypeScript bindings for Go services
    run: once
    deps:
      - task: go:mod:tidy
    sources:
      - "**/*.[jt]s"
      - exclude: frontend/**/*
      - frontend/bindings/**/*
      - "**/*.go"
      - go.mod
      - go.sum
    generates:
      - frontend/bindings/**/*
    cmds:
      - wails3 generate bindings -f '{{.BUILD_FLAGS}}' -clean=true -ts -i .

  build:frontend:
    summary: Builds the frontend bundle into frontend/dist
    run: once
    dir: frontend
    sources:
      - "**/*"
      - exclude: node_modules/**/*
      - exclude: dist/**/*
    generates:
      - dist/**/*
    deps:
      - task: install:frontend:deps
      - task: generate:bindings
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
    cmds:
      - npm run {{if eq .DEV "true"}}build:dev{{else}}build{{end}}
    env:
      PRODUCTION: '{{if eq .DEV "true"}}false{{else}}true{{end}}'

  dev:frontend:
    summary: Runs the Vite development server
    deps:
      - task: install:frontend:deps
    dir: frontend
    cmds:
      - npm run dev -- --port {{.VITE_PORT}} --strictPort

  test:frontend:
    summary: Runs frontend unit tests
    dir: frontend
    cmds:
      - npm run test

  check:frontend:
    summary: Runs Svelte type checks, lint and formatting checks
    dir: frontend
    cmds:
      - npm run check
      - npm run format
      - npm run lint

  lint:frontend:
    summary: Runs lint and formatting checks
    dir: frontend
    cmds:
      - npm run lint
      - npm run format

  format:frontend:
    summary: Checks frontend formatting
    dir: frontend
    cmds:
      - npm run format

  format:write:frontend:
    summary: Formats frontend sources
    dir: frontend
    cmds:
      - npm run format:write

  update:build-assets:
    summary: Regenerates Wails build assets from build/config.yml
    dir: build
    cmds:
      - wails3 update build-assets -name "{{.APP_NAME}}" -binaryname "{{.APP_NAME}}" -config config.yml -dir .
